# Relationship Tree: RelationshipTree_6
# Objects must be processed in this order for proper lookup resolution

# Level 0 - Product2
# Product2 (No relationships)

- object: Product2
  nickname: Product2_NickName
  count: 1
  fields:
    Name: ${{faker.commerce.productName()}}
    Description: ${{faker.lorem.paragraph()}}
    ProductCode: ${{faker.commerce.product()}}-${{faker.string.alphanumeric(6)}}
    IsActive: ${{faker.helpers.arrayElement(['true', 'false'])}}
    Family: ${{faker.helpers.arrayElement(['Hardware', 'Software', 'Services', 'Other'])}}
    QuantityUnitOfMeasure: ${{faker.helpers.arrayElement(['Each', 'Case', 'Box', 'Pallet'])}}
    DisplayUrl: ${{faker.internet.url()}}
    ExternalId: ${{faker.string.uuid()}}
    Cost__c: |
            ${{ faker.number.bigInt({min: 0n, max: 9999999999999999n}) + '.' + faker.string.numeric({length: 2, allowLeadingZeros: true}) }}
    Current_Inventory__c: |
            ${{ faker.number.bigInt({min: 0n, max: 999999999999999999n}).toString() }}
    ExternalDataSourceId: ### TODO -- REFERENCE ID REQUIRED
    Lifespan_Months__c: |
            ${{ faker.number.bigInt({min: 0n, max: 999999999999999999n}).toString() }}
    Maintenance_Cycle__c: |
            ${{ faker.number.bigInt({min: 0n, max: 999999999999999999n}).toString() }}
    Replacement_Part__c: ${{ faker.datatype.boolean() }}
    SellerId: ### TODO -- REFERENCE ID REQUIRED
    SourceProductId: ### TODO -- REFERENCE ID REQUIRED
    StockKeepingUnit: ### TODO -- REVIEW THIS LINE TO DETERMINE IF IT SHOULD BE REMOVED - IN THE FIELD FILE THERE IS NO TYPE DEFINITION IN XML MARKUP - THIS FIELD'S VALUE MAY BE AUTO GENERATED BY SALESFORCE
    Warehouse_SKU__c: ${{ faker.lorem.text(100).substring(0, 100) }}

