# Relationship Tree: RelationshipTree_3
# Objects must be processed in this order for proper lookup resolution

# Level 0 - Lead
# Lead (No relationships)

- object: Lead
  nickname: Lead_NickName
  count: 1
  fields:
    FirstName: ${{fake.first_name}}
    LastName: ${{fake.last_name}}
    Company: ${{fake.company}}
    Title: ${{fake.job}}
    Email: ${{fake.email}}
    Phone: ${{fake.phone_number}}
    MobilePhone: ${{fake.phone_number}}
    Street: ${{fake.street_address}}
    City: ${{fake.city}}
    State: ${{fake.state}}
    PostalCode: ${{fake.zipcode}}
