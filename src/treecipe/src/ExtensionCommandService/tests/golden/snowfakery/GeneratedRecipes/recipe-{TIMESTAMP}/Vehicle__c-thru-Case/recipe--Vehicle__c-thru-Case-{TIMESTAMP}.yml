# Relationship Tree: RelationshipTree_2
# Objects must be processed in this order for proper lookup resolution

# Level 0 - Vehicle__c
# Level 1 - Case
# Case (Parents: Vehicle__c)

- object: Case
  nickname: Case_NickName
  count: 1
  fields:
    Subject: ${{fake.catch_phrase}}
    Description: ${{fake.paragraph}}
    Status: ${{random_choice('New', 'Working', 'Escalated', 'Closed')}}
    Origin: ${{random_choice('Email', 'Phone', 'Web', 'Social')}}
    Priority: ${{random_choice('High', 'Medium', 'Low')}}
    Type: ${{random_choice('Problem', 'Feature Request', 'Question')}}
    Reason: ${{random_choice('Installation', 'Equipment Complexity', 'Performance', 'Breakdown', 'Equipment Design', 'Feedback')}}
    SuppliedName: ${{fake.name}}
    SuppliedEmail: ${{fake.email}}
    SuppliedPhone: ${{fake.phone_number}}
    SuppliedCompany: ${{fake.company}}
    Case_Category__c: ${{ random_choice('Mechanical', 'Electrical', 'Electronic', 'Structural', 'Other') }}
    PotentialLiability__c: ${{ random_choice('No', 'Yes') }}
    ProductId: ### TODO -- REFERENCE ID REQUIRED
    Product__c: ${{ random_choice('GC1040', 'GC1060', 'GC3020', 'GC3040', 'GC3060', 'GC5020', 'GC5040', 'GC5060', 'GC1020') }}
    SLAViolation__c: ${{ random_choice('No', 'Yes') }}
    SlaExitDate: ### TODO -- REVIEW THIS LINE TO DETERMINE IF IT SHOULD BE REMOVED - IN THE FIELD FILE THERE IS NO TYPE DEFINITION IN XML MARKUP - THIS FIELD'S VALUE MAY BE AUTO GENERATED BY SALESFORCE
    SlaStartDate: ### TODO -- REVIEW THIS LINE TO DETERMINE IF IT SHOULD BE REMOVED - IN THE FIELD FILE THERE IS NO TYPE DEFINITION IN XML MARKUP - THIS FIELD'S VALUE MAY BE AUTO GENERATED BY SALESFORCE
    Vehicle__c: ### TODO -- REFERENCE ID REQUIRED

