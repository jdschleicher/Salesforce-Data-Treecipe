# Relationship Tree: RelationshipTree_6
# Objects must be processed in this order for proper lookup resolution

# Level 0 - Product2
# Product2 (No relationships)

- object: Product2
  nickname: Product2_NickName
  count: 1
  fields:
    Name: ${{fake.catch_phrase}}
    Description: ${{fake.bs}}
    ProductCode: ${{fake.ean}}
    IsActive: ${{random_choice('true', 'false')}}
    Family: ${{random_choice('Hardware', 'Software', 'Services', 'Other')}}
    QuantityUnitOfMeasure: ${{random_choice('Each', 'Case', 'Box', 'Pallet')}}
    DisplayUrl: ${{fake.url}}
    ExternalId: ${{fake.uuid4}}
    Cost__c: ${{fake.pydecimal(left_digits=16, right_digits=2, positive=True)}}
    Current_Inventory__c: ${{fake.random_int(min=0, max=999999999999999999)}}
    ExternalDataSourceId: ### TODO -- REFERENCE ID REQUIRED
    Lifespan_Months__c: ${{fake.random_int(min=0, max=999999999999999999)}}
    Maintenance_Cycle__c: ${{fake.random_int(min=0, max=999999999999999999)}}
    Replacement_Part__c: ${{ (random_choice("true", "false")).lower() }}
    SellerId: ### TODO -- REFERENCE ID REQUIRED
    SourceProductId: ### TODO -- REFERENCE ID REQUIRED
    StockKeepingUnit: ### TODO -- REVIEW THIS LINE TO DETERMINE IF IT SHOULD BE REMOVED - IN THE FIELD FILE THERE IS NO TYPE DEFINITION IN XML MARKUP - THIS FIELD'S VALUE MAY BE AUTO GENERATED BY SALESFORCE
    Warehouse_SKU__c: ${{fake.text(max_nb_chars=100)}}

