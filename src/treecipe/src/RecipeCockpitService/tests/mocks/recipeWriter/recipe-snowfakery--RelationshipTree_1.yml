# Relationship Tree: RelationshipTree_1
# Objects must be processed in this order for proper lookup resolution

# Level 0 - Account, Product_Family__c, User
# Account (Children: Contact, Example_Everything__c, Opportunity, Order__c)

- object: Account
  nickname: Account_NickName
  count: 1
  fields:
    Name: ${{fake.company}}
    AnnualRevenue: ${{random_number(1000000,9999999)}}.00
    BillingStreet: ${{fake.street_address}}
    BillingCity: ${{fake.city}}
    BillingState: ${{fake.state}}
    BillingPostalCode: ${{fake.zipcode}}
    BillingCountry: ${{fake.country}}
